# verdict_schemas.yaml — schema registry for the verdict synthesizer.
#
# A "verdict" is a structured, skimmable artifact synthesized from a finished
# conversation. The SAME synthesizer engine produces verdicts for any topic —
# only the schema changes. A schema has two parts:
#
#   per_subtopic: one card emitted per planned subtopic (the resolution of that
#                 slice of the debate). `type` picks the render primitive.
#   rollup:       one whole-conversation artifact assembled from the cards.
#
# `fields` lists the keys the synthesizer must populate; `instruction` tells it
# how. Add a new domain by adding an entry here — no code changes.

schemas:
  travel-decision:
    description: "Per-subtopic decision + a trip-planning rollup."
    per_subtopic:
      type: verdict-card
      fields: [question, the_call, why, confidence, dissent]
      instruction: >
        From this subtopic's exchange, identify the core question that was
        actually debated (question), state THE single recommended call for the
        specific traveler described in the title (the_call), give a one-sentence
        why grounded in a concrete detail someone said (why), rate how strongly
        the speakers supported it as low|med|high (confidence), and note any
        genuine disagreement that remained, or "none" (dissent). Keep each field
        to one or two sentences. Do not invent facts not present in the exchange.
    rollup:
      type: trip-plan
      fields: [bottom_line, budget_breakdown, day_plan, book_now]
      instruction: >
        Synthesize the verdict cards into a concrete plan for the traveler in the
        title. bottom_line: one sentence a first-timer can act on. budget_breakdown:
        a list of {label, amount} rows whose amounts SUM to the budget stated in
        the title (include a buffer row if needed so it sums exactly); use only
        figures consistent with what was discussed. day_plan: a list of
        {days, what} rows covering the full trip length. book_now: a list of
        {item, when} rows for what to reserve and how far ahead. Do not introduce
        destinations or prices the conversation never mentioned.

  product-review:
    description: "Per-subtopic decision + a buying-guide rollup."
    per_subtopic:
      type: verdict-card
      fields: [question, the_call, why, confidence]
      instruction: >
        From this subtopic's exchange, identify the buying question debated
        (question), state the recommended call (the_call), give a one-sentence why
        grounded in a concrete detail (why), and rate support as low|med|high
        (confidence). Do not invent specs or prices.
    rollup:
      type: comparison
      fields: [items, criteria, cells, pros_cons, overall_pick, best_for_map]
      instruction: >
        Build a buying guide from the cards. items: the products/options compared.
        criteria: the dimensions used to compare them. cells: a list of
        {item, criterion, value} entries giving each item's value on each
        criterion. pros_cons: a list of {item, pros, cons} with short bullet
        lists. overall_pick: the single best default choice with a one-line why.
        best_for_map: a list of {use_case, item} mapping a buyer situation to the
        right pick. Use ONLY specifics actually present in the conversation; never
        invent prices or model numbers.
